<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuddlePlus - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
        .login-card h1 { color: #4a90e2; font-size: 24px; margin-bottom: 10px; }
        .login-card p { color: #666; margin-bottom: 30px; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #e1e4e8; border-radius: 6px; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #4a90e2; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #357abd; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>BuddlePlus</h1>
        <p>Facilities Solution Management</p>
        
        <div id="errorMsg" class="error-msg">Invalid username or password.</div>
        
        <input type="text" id="loginUser" placeholder="Username">
        <input type="password" id="loginPass" placeholder="Password">
        <button onclick="handleLogin()">Login</button>
    </div>

    <script>
        // Ensure default Admin exists in system
        // Inside login.html <script>
        let users = JSON.parse(localStorage.getItem('buddleUsers'));
        if (!users || users.length === 0) {
        users = [
        // Admin has access to everything
        { id: 1, username: 'admin', password: '123', role: 'Admin', level: 'Manager', status: 'Active' },
        
        // HR Manager: Can see everyone
        { id: 2, username: 'hrmanager', password: '123', role: 'HR', level: 'Manager', status: 'Active' },
        
        // HR Staff: Can only see other Staff
        { id: 3, username: 'hrstaff', password: '123', role: 'HR', level: 'Staff', status: 'Active' }
        ];
        localStorage.setItem('buddleUsers', JSON.stringify(users));
}

        function handleLogin() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const error = document.getElementById('errorMsg');
            
            const foundUser = users.find(u => u.username === user && u.password === pass && u.status === 'Active');
            
            if (foundUser) {
                // Save session
                localStorage.setItem('currentUser', JSON.stringify(foundUser));
                
                // Redirect based on role
                if (foundUser.role === 'HR') {
                    window.location.href = 'HRM.html';
                } else if (foundUser.role === 'Finance') {
                    window.location.href = 'finance.html'; // Sends them to finance first
                } else if (foundUser.role === 'Operation') {
                    window.location.href = 'Operation.html';
                } else {
                    window.location.href = 'index.html'; // Admin goes to main dashboard
                }
            } else {
                error.style.display = 'block';
            }
        }
    </script>
</body>
</html>
